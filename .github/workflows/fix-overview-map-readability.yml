name: Fix overview map readability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-overview-map-readability.yml'

permissions:
  contents: write

jobs:
  fix-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify overview map
        run: python .github/scripts/fix_overview_map.py
      - name: Commit updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html public/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Improve overview map readability [skip ci]"
            git pull --rebase origin main
            git push
          fi
